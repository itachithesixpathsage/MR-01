[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mr01-independent-calculator"
version = "0.1.0"
description = "Independent research calculator for the MR-01 signal methodology"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "pandas>=2.1", "pydantic>=2.5", "typer>=0.12", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
mr01 = "mr01.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
